# Что pygbag НЕ пакует в архив игры.
# Файл читается из текущей каталога при запуске pygbag (см. rebuild.py, cwd = папка проекта),
# поэтому лежит здесь, а не в mobile/.
#
# pygbag собирает всё, что лежит в папке приложения (mobile/) — включая скрипты
# сборки и кэш рантайма. Без этого списка архив вырос с 1.1 до 12 МБ, и весь
# кэш летел бы в телефон вместе с игрой.
# Ведущий слэш обязателен: pygbag сравнивает пути вида "/имя_папки/..." с началом строки,
# без слэша игнорируется только сама папка, а её содержимое — уже нет.
[DEPENDENCIES]
ignoreDirs = ["/build", "/cdn_cache"]
ignoreFiles = ["make_mobile.py", "prepare_offline.py", "build_apk.py", "rebuild.py", "setup.py", "serve_web.py", "dl_sdk.sh", "serve.log", "pygbag.ini"]
